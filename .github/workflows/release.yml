name: Release

on:
  push:
    branches: [main]
  # Canary publishes only; the publish job never runs on PRs. Lives in
  # this file because npm's trusted publisher is pinned to release.yml.
  pull_request:

jobs:
  # Publishes when a release PR (maintained by release-pr.yml) merges.
  # The version bump lands on main through that PR like any other
  # change, so nothing here pushes to main and the branch ruleset
  # stays intact. Requires squash-merging the release PR: the guard
  # matches the squashed commit title.
  publish:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'release: v')
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # No typecheck/test here: the release PR passed the required
      # checks to merge. bun install is for prepublishOnly's build.
      - run: bun install --frozen-lockfile

      # npm, not bun: bun publish doesn't support npm trusted publishing
      # (OIDC), see oven-sh/bun#22423. Trusted publishing needs npm >= 11.5.1,
      # hence npx (a global upgrade hits EACCES on /usr/local).
      - name: Publish to npm
        run: npx -y npm@latest publish --access public --provenance

      - name: Create GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version package.json)
          gh release create "v$version" --target "$GITHUB_SHA" --generate-notes

  canary:
    runs-on: ubuntu-latest
    # Same-repo PRs only: fork PRs can't mint OIDC tokens, and publishing
    # a canary is effectively release access.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: canary-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # typecheck/test already run on PRs via ci.yml; this job only
      # exercises the publish pipeline.
      - name: Publish canary to npm
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          version="$(jq -r .version package.json)-canary.${PR}.${HEAD_SHA:0:7}"
          npm pkg set version="$version"
          npx -y npm@latest publish --access public --tag canary --provenance=false
          echo "Published \`jj-pr@${version}\` (dist-tag \`canary\`)" >> "$GITHUB_STEP_SUMMARY"
