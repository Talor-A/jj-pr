name: Release

on:
  # Ride on CI finishing for main instead of a second push trigger, so
  # typecheck/test don't run twice per merge; the release job gates on
  # CI's conclusion below.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Canary publishes only; the release job never runs on PRs. Lives in
  # this file because npm's trusted publisher is pinned to release.yml.
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump level
        type: choice
        options: [patch, minor, major]
        default: patch

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: release
      cancel-in-progress: false
    # Release only when CI succeeded (or on manual dispatch, which skips
    # the gate). Release commits don't loop: pushes made with GITHUB_TOKEN
    # don't trigger CI at all; the message guard also covers manual
    # `npm version` pushes.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       !startsWith(github.event.workflow_run.head_commit.message, 'release:'))
    steps:
      - uses: actions/checkout@v4
        with:
          # Latest main rather than the triggering SHA, so queued runs
          # build on top of the previous run's release commit.
          ref: main

      - uses: oven-sh/setup-bun@v2

      # No typecheck/test/jj here: CI already ran them for this commit,
      # and the workflow_run gate above requires it to have succeeded.
      # bun install stays because publish's prepublishOnly runs the build.
      - run: bun install --frozen-lockfile

      - name: Bump version
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag=$(npm version "${{ inputs.bump || 'patch' }}" -m "release: %s")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Publish before pushing: if publish fails, nothing lands in git
      # and a rerun starts from the same version.
      # npm, not bun: bun publish doesn't support npm trusted publishing
      # (OIDC), see oven-sh/bun#22423. Trusted publishing needs npm >= 11.5.1,
      # hence npx (a global upgrade hits EACCES on /usr/local).
      - name: Publish to npm
        run: npx -y npm@latest publish --access public --provenance

      - name: Push release commit and tag
        run: git push origin main --follow-tags

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.bump.outputs.tag }}" --generate-notes

  canary:
    runs-on: ubuntu-latest
    # Same-repo PRs only: fork PRs can't mint OIDC tokens, and publishing
    # a canary is effectively release access.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: canary-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # typecheck/test already run on PRs via ci.yml; this job only
      # exercises the publish pipeline.
      - name: Publish canary to npm
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          version="$(jq -r .version package.json)-canary.${PR}.${HEAD_SHA:0:7}"
          npm pkg set version="$version"
          npx -y npm@latest publish --access public --tag canary --provenance=false
          echo "Published \`jj-pr@${version}\` (dist-tag \`canary\`)" >> "$GITHUB_STEP_SUMMARY"
