name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump level
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip release commits. Pushes made with GITHUB_TOKEN don't retrigger
    # workflows anyway; this also covers manual `npm version` pushes.
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'release:')
    steps:
      - uses: actions/checkout@v4
        with:
          # Latest main rather than the triggering SHA, so queued runs
          # build on top of the previous run's release commit.
          ref: main

      - uses: oven-sh/setup-bun@v2

      - name: Install jj
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo jj-vcs/jj --json tagName -q .tagName)
          mkdir -p "$HOME/.local/bin"
          gh release download "$tag" --repo jj-vcs/jj \
            --pattern "jj-${tag}-x86_64-unknown-linux-musl.tar.gz" \
            --output - | tar xz -C "$HOME/.local/bin" ./jj
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

      - name: Bump version
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag=$(npm version "${{ inputs.bump || 'patch' }}" -m "release: %s")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Publish before pushing: if publish fails, nothing lands in git
      # and a rerun starts from the same version.
      - run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push release commit and tag
        run: git push origin main --follow-tags

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.bump.outputs.tag }}" --generate-notes
